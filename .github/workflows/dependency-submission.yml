name: Dependency Graph

# Enable GitHub's dependency graph for this repository. The
# Dependabot-friendly manifest is package.json.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Submit npm dependency graph
        uses: github/dependency-submission-action@5e99e8603a902552896e278a1a5e82ce8c5a6e9c # v4
        with:
          package-manager: npm
