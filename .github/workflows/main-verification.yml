name: Main Verification

# Direct-to-main integration lane for ORCHORDS/OrchordsBrowserPilot.
#
# Policy: no branches, no PR-only lane. All work lands on `main` via a merge
# queue (or rebase-merge). CI validates the exact SHA that becomes HEAD with
# locked dependencies. Minimum/latest Playwright compatibility is covered by
# the scheduled Daily Build instead of being repeated on every push.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Install Playwright browser
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Lint + type-check + tests
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          npm test

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm pack --dry-run
