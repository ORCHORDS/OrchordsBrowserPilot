name: Main Verification

# Only verification lane for ORCHORDS/orchords-web-pilot.
#
# Policy: no branches, no PR-only lane. All work lands on `main` via a merge
# queue (or rebase-merge). CI runs once against the exact SHA that becomes
# HEAD, on a GitHub-hosted `ubuntu-latest` runner. Why hosted:
#   - the repo has no registered self-hosted runner today
#   - the prior ORCHORDS repo (OrchordsAI) only registers one self-hosted
#     runner (codeql-java) for a Java/Kotlin-specific CodeQL leg; that label
#     does not exist here and a Node/Playwright workload doesn't fit it
#   - hosted runners give us ephemeral, isolated Linux for every merge
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
  # Always let the in-flight trusted run finish so the required check
  # reports for that exact SHA. A forced cancel would let a fresh push
  # race a check for a different SHA.

jobs:
  sync-lock:
    if: github.event.head_commit.message == 'ci: sync Playwright lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Regenerate and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'ORCHORDS.COM'
          git config user.email '72497645+ORCHORDS@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync Playwright lockfile for 1.59.1 floor (#105)'
          git push origin HEAD:main

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Install Playwright browser
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Lint + type-check + tests
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          npm test

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm pack --dry-run
