name: Main Verification

# Only verification lane for ORCHORDS/orchords-web-pilot.
#
# Policy: no branches, no PR-only lane. All work lands on `main` via a merge
# queue (or rebase-merge). CI runs once against the exact SHA that becomes
# HEAD, on a GitHub-hosted `ubuntu-latest` runner.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Install Playwright browser
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Lint + type-check + tests
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          npm test

  playwright-min:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Force declared minimum Playwright
        run: npm install --no-save --package-lock=false playwright@1.59.1

      - name: Install minimum-version Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and exercise minimum-version browser path
        run: |
          set -euo pipefail
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version !== '1.59.1') throw new Error('expected Playwright 1.59.1, got '+p.version)"
          npm run build
          node --test --import tsx test/playwright-compatibility.test.ts test/e2e-stdio.test.ts

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm pack --dry-run
