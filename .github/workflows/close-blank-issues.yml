name: Close Blank Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close issues with no body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          # ISSUE_BODY and ISSUE_NUMBER are passed via env to avoid bash
          # interpreting issue contents (backticks, $(...), etc.) as code.
          if [[ -z "${ISSUE_BODY// }" ]]; then
            gh issue close "${ISSUE_NUMBER}" --comment "Closing blank issue. Please reopen with a description and reproduction steps."
          fi
