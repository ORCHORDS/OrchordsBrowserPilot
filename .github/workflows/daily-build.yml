name: Daily Build

# Smoke test against today's Node.js LTS + latest Playwright.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install + build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: HTTP transport smoke
        shell: bash
        run: |
          set -euo pipefail
          PILOT_TRANSPORT=http PILOT_HTTP_PORT=8788 node dist/cli.js &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8788/mcp/health
          kill $PID
