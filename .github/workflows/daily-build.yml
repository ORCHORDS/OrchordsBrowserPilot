name: Daily Build

# Scheduled compatibility smoke against the current stable Playwright release.
# The repository lockfile is tested on every main push; this lane deliberately
# overrides Playwright with the npm `latest` tag so upstream drift is detected
# before the supported range or lockfile is changed.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies then current stable Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright@latest
          node -e "console.log('Testing Playwright', require('./node_modules/playwright/package.json').version)"

      - name: Install current stable Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Build + compatibility/browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --test --import tsx test/playwright-compatibility.test.ts test/e2e-stdio.test.ts

      - name: HTTP transport smoke
        shell: bash
        run: |
          set -euo pipefail
          PILOT_TRANSPORT=http PILOT_HTTP_PORT=8788 node dist/cli.js &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8788/mcp/health; then
              exit 0
            fi
            sleep 0.25
          done
          echo 'HTTP health endpoint did not become ready' >&2
          exit 1
